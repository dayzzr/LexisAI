<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexis AI - Python IDE</title>
    
    <!-- Skulpt (Interpretador Python para Navegador) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt-stdlib.js"></script>

    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent-blue: #1f6feb;
            --accent-green: #238636;
            --accent-red: #da3633;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fira Code', Consolas, Monaco, monospace;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Topbar / Navegação */
        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffffff;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        button, .file-upload-btn {
            background-color: var(--bg-primary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        button:hover, .file-upload-btn:hover {
            background-color: var(--border-color);
        }

        #btn-run {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
            color: #fff;
            font-weight: bold;
        }
        #btn-run:hover { background-color: #2ea043; }

        #btn-stop {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
            color: #fff;
        }
        #btn-stop:hover { background-color: #b62324; }

        input[type="file"] {
            display: none;
        }

        /* Layout Principal dividido */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .workspace { flex-direction: column; }
        }

        .editor-pane, .output-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            position: relative;
        }

        .pane-header {
            background-color: var(--bg-secondary);
            padding: 6px 12px;
            font-size: 0.75rem;
            color: #8b949e;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Área de Código com suporte a Guia de Indentação */
        .editor-container {
            flex: 1;
            position: relative;
            background-color: #040d21;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            color: #f0f6fc;
            border: none;
            padding: 12px;
            resize: none;
            font-size: 0.9rem;
            line-height: 1.5;
            outline: none;
            tab-size: 4;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
            z-index: 2;
            position: relative;
        }

        /* Efeito de Guia de Indentação Ativável */
        .indent-guides textarea {
            background-image: linear-gradient(to right, rgba(48, 54, 61, 0.4) 1px, transparent 1px);
            background-size: 36px 100%; /* Largura visual correspondente ao tab */
        }

        /* Console de Saída e Canvas */
        #output {
            background-color: #020408;
            color: #3fb950;
            padding: 12px;
            font-size: 0.85rem;
            height: 120px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            white-space: pre-wrap;
        }

        .canvas-container {
            flex: 1;
            background-color: #020204;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #mycanvas {
            background-color: #020204;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span>⚡ Lexis AI IDE</span>
        </div>
        <div class="controls">
            <!-- Botão de Upload Multiplataforma (PC / Mobile) -->
            <label for="file-input" class="file-upload-btn">
                📁 Anexar Arquivo
            </label>
            <input type="file" id="file-input" onchange="carregarArquivoLocal(event)">

            <!-- Botão Guia de Indentação -->
            <button onclick="toggleIndentationGuides()" id="btn-indent" title="Alternar linhas de indentação">📏 Guias</button>

            <!-- Executar e Parar -->
            <button id="btn-run" onclick="executarPython()">▶ Executar</button>
            <button id="btn-stop" onclick="pararExecucao()">■ Parar</button>
        </div>
    </header>

    <div class="workspace">
        <!-- Editor de Código -->
        <div class="editor-pane" id="editor-wrapper">
            <div class="pane-header">main.py (Ambiente de Scripting)</div>
            <div class="editor-container">
                <textarea id="code" spellcheck="false" placeholder="# Digite seu código Python ou importe um script aqui...">import turtle
import math
import time

print("=====================================================")
print(" LEXIS AI: SIMULADOR FÍSICO DO CAOS (PÊNDULO DUPLO)")
print("=====================================================")
print("[+] Inicializando matriz de gravidade e massas...")

tela = turtle.Screen()
tela.clearscreen()
tela.bgcolor("#020204")
tela.tracer(0)

t = turtle.Turtle()
t.hideturtle()
t.speed(0)

g = 1.8       
m1 = 15.0     
m2 = 15.0     
r1 = 85.0     
r2 = 85.0     
dt = 0.15     

ox, oy = 0, 70 
cores = ["#00f0ff", "#ff0055", "#ffff00"]
pendulos = []

for i in range(3):
    a1 = 2.2 + (i * 0.015) 
    a2 = 2.2
    pendulos.append({
        "a1": a1, "a2": a2, 
        "v1": 0.0, "v2": 0.0, 
        "cor": cores[i],
        "historico": []
    })

print("[+] Efeito Borboleta ativado. Aguarde a divergência...")

try:
    while True:
        for _ in range(2): 
            for p in pendulos:
                a1, a2, v1, v2 = p["a1"], p["a2"], p["v1"], p["v2"]
                
                num1 = -g * (2 * m1 + m2) * math.sin(a1) - m2 * g * math.sin(a1 - 2 * a2) - 2 * math.sin(a1 - a2) * m2 * (v2 * v2 * r2 + v1 * v1 * r1 * math.cos(a1 - a2))
                den1 = r1 * (2 * m1 + m2 - m2 * math.cos(2 * a1 - 2 * a2))
                acc1 = num1 / den1
                
                num2 = 2 * math.sin(a1 - a2) * (v1 * v1 * r1 * (m1 + m2) + g * (m1 + m2) * math.cos(a1) + v2 * v2 * r2 * m2 * math.cos(a1 - a2))
                den2 = r2 * (2 * m1 + m2 - m2 * math.cos(2 * a1 - 2 * a2))
                acc2 = num2 / den2
                
                p["v1"] = (v1 + acc1 * dt)
                p["v2"] = (v2 + acc2 * dt)
                p["a1"] += p["v1"] * dt
                p["a2"] += p["v2"] * dt
                
                p["x1"] = ox + r1 * math.sin(p["a1"])
                p["y1"] = oy - r1 * math.cos(p["a1"])
                p["x2"] = p["x1"] + r2 * math.sin(p["a2"])
                p["y2"] = p["y1"] - r2 * math.cos(p["a2"])
                
                p["historico"].append((p["x2"], p["y2"]))
                if len(p["historico"]) > 60: p["historico"].pop(0)

        t.clear()
        
        for p in pendulos:
            t.pensize(3.5)
            t.pencolor(p["cor"])
            t.penup()
            primeiro = True
            for hx, hy in p["historico"]:
                t.goto(hx, hy)
                if primeiro:
                    t.pendown()
                    primeiro = False
            t.penup()
            
        for p in pendulos:
            t.pensize(2)
            t.pencolor("#444455") 
            t.penup()
            t.goto(ox, oy)
            t.pendown()
            t.goto(p["x1"], p["y1"])
            t.dot(6, "#ffffff") 
            t.goto(p["x2"], p["y2"])
            t.dot(10, p["cor"]) 
            t.penup()
            
        t.goto(ox, oy)
        t.dot(12, "#ffffff")
        tela.update()
        time.sleep(0.01)
except Exception as e:
    print("Erro na simulação:", e)
</textarea>
            </div>
            <div id="output">Lexis AI Engine pronto. Módulos nativos carregados.</div>
        </div>

        <!-- Palco Gráfico (Turtle / Canvas) -->
        <div class="output-pane">
            <div class="pane-header">Renderização Gráfica em Tempo Real</div>
            <div class="canvas-container">
                <div id="mycanvas"></div>
            </div>
        </div>
    </div>

    <script>
        // Função para direcionar os "prints" do Python para a div #output
        function outf(text) {
            let mydiv = document.getElementById("output");
            mydiv.innerHTML += text;
            mydiv.scrollTop = mydiv.scrollHeight; 
        }

        // Sistema de Importação Dinâmica de Bibliotecas Nativas do Skulpt
        function builtinRead(x) {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
                throw "Biblioteca não suportada ou não encontrada: " + x;
            }
            return Sk.builtinFiles["files"][x];
        }

        // 1. Upload de Arquivos Multiplataforma via File API
        function carregarArquivoLocal(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;

            const leitor = new FileReader();
            leitor.onload = function(e) {
                const conteudoLido = e.target.result;
                document.getElementById("code").value = conteudoLido;
                document.getElementById("output").innerText += `\n[+] Script '${arquivo.name}' injetado no editor com sucesso.`;
            };
            leitor.readAsText(arquivo);
        }

        // 2. Sistema de Destaque de Indentações (Toggle)
        let guiasAtivas = false;
        function toggleIndentationGuides() {
            guiasAtivas = !guiasAtivas;
            const wrapper = document.getElementById("editor-wrapper");
            const botao = document.getElementById("btn-indent");
            
            if (guiasAtivas) {
                wrapper.classList.add("indent-guides");
                botao.style.borderColor = "var(--accent-blue)";
                botao.style.color = "var(--accent-blue)";
            } else {
                wrapper.classList.remove("indent-guides");
                botao.style.borderColor = "var(--border-color)";
                botao.style.color = "var(--text-main)";
            }
        }

        // 3. Motor de Execução Skulpt
        function executarPython() {
            let prog = document.getElementById("code").value;
            let mydiv = document.getElementById("output");
            mydiv.innerHTML = "[+] Compilando matriz lógica e resolvendo imports...\n";
            
            // Limpa o palco gráfico antes de uma nova execução
            document.getElementById("mycanvas").innerHTML = "";

            Sk.pre("mycanvas");
            Sk.configure({
                output: outf,
                read: builtinRead,
                nonBlocking: true,
                execLimit: Number.POSITIVE_INFINITY 
            });

            (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = 'mycanvas';

            // Executa o script assincronamente
            let execucaoAtiva = Sk.importMainWithBody("<stdin>", false, prog, true);
            execucaoAtiva.then(function(mod) {
                console.log('Execução finalizada com sucesso.');
            },
            function(err) {
                mydiv.innerHTML += "\n[Erro Sintático ou Lógico]: " + err.toString();
            });
        }

        // Função para abortar o script recarregando o ambiente
        function pararExecucao() {
            location.reload(); 
        }
    </script>
</body>
</html>
