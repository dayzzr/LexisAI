<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexis AI — IDE Python</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { apple: { bgLight: '#F2F2F7', bgDark: '#1C1C1E', surfaceLight: '#FFFFFF', surfaceDark: '#2C2C2E', borderLight: '#E5E5EA', borderDark: '#38383A', blue: '#007AFF', darkBlue: '#0A84FF' } } } }
        }
    </script>

    <!-- CodeMirror (Editor) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/lib/codemirror.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/theme/dracula.css">
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/lib/codemirror.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/mode/python/python.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/addon/edit/closebrackets.js"></script>

    <!-- Skulpt (Motor Python) -->
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

    <style>
        /* Correção para o Scroll Independente do Editor (iPad/Mobile) */
        .CodeMirror { 
            position: absolute; 
            top: 0; bottom: 0; left: 0; right: 0;
            height: 100%; 
            font-family: 'SF Mono', monospace; 
            font-size: 15px; 
        }
        * { transition: background-color 0.3s ease, border-color 0.3s ease; }
        
        /* Modificador para as Guias de Indentação (CodeMirror) */
        .CodeMirror.show-guides .CodeMirror-line {
            background-image: linear-gradient(to right, rgba(128, 128, 128, 0.25) 1px, transparent 1px);
            background-size: 36px 100%; /* Largura exata para 4 espaços */
            background-repeat: repeat-y;
            background-position: 4px 0; /* Alinhamento com a margem do texto */
        }
    </style>
</head>
<body class="bg-apple-bgLight text-gray-900 dark:bg-apple-bgDark dark:text-gray-100 min-h-[100dvh] flex flex-col">

    <!-- Header -->
    <header class="bg-white/90 dark:bg-apple-surfaceDark/90 backdrop-blur-md border-b border-apple-borderLight dark:border-apple-borderDark px-4 py-3 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <img src="image.png" alt="Lexis AI" class="w-10 h-10 object-contain drop-shadow-sm rounded-lg dark:invert" onerror="this.style.display='none'">
            <h1 class="text-xl font-bold tracking-tight">Lexis AI</h1>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
            <!-- Botão de Importar Arquivo (PC/Mobile) -->
            <label for="file-upload" class="bg-gray-100 hover:bg-gray-200 dark:bg-[#3A3A3C] dark:hover:bg-[#48484A] text-gray-900 dark:text-gray-100 px-4 py-2.5 rounded-xl font-semibold text-sm cursor-pointer shadow-sm active:scale-95 flex items-center gap-2">
                📁 Anexar
            </label>
            <input id="file-upload" type="file" class="hidden" onchange="importarArquivo(event)" />

            <!-- Botão de Toggle Indentação -->
            <button onclick="toggleGuides()" id="btn-guides" class="bg-gray-100 hover:bg-gray-200 dark:bg-[#3A3A3C] dark:hover:bg-[#48484A] text-gray-900 dark:text-gray-100 px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2 shadow-sm active:scale-95">
                <span id="guides-icon">📏</span> Guias
            </button>

            <!-- Controles Originais -->
            <button onclick="toggleTheme()" class="p-2 ml-1 mr-1 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
                <svg id="theme-icon-sun" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m3.343-5.657l-.707-.707m12.728 12.728l-.707-.707M6.343 17.657l-.707.707M17.657 6.343l-.707-.707M12 7a5 5 0 100 10 5 5 0 000-10z"/></svg>
                <svg id="theme-icon-moon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
            </button>
            <button onclick="stopExecution()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2 shadow-sm active:scale-95">
                <span>Parar</span>
            </button>
            <button onclick="runPython()" class="bg-apple-blue hover:bg-blue-600 text-white px-5 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2 shadow-sm active:scale-95">
                <span>Executar</span>
            </button>
        </div>
    </header>

    <!-- Workspace -->
    <main class="flex-1 w-full max-w-screen-2xl mx-auto p-4 flex flex-col lg:flex-row gap-5">
        
        <!-- Editor -->
        <section class="flex-1 flex flex-col min-h-[400px] h-[50vh] lg:h-auto bg-white dark:bg-apple-surfaceDark rounded-2xl border border-apple-borderLight dark:border-apple-borderDark shadow-md">
            <div class="bg-gray-100 dark:bg-[#222224] px-3 pt-2 border-b border-apple-borderLight dark:border-apple-borderDark flex items-center justify-between rounded-t-2xl">
                <div id="tabs-container" class="flex items-center gap-1 overflow-x-auto"></div>
                <div class="flex items-center gap-2 pb-1 shrink-0">
                    <button onclick="addNewTab()" class="p-1.5 text-gray-500 hover:text-black dark:hover:text-white rounded-lg hover:bg-gray-300 text-xs font-bold">+ Novo</button>
                    <button onclick="clearEditor()" class="p-1.5 text-red-500 hover:bg-gray-300 text-xs font-bold">Limpar</button>
                    <button onclick="saveFile()" class="p-1.5 text-blue-500 hover:bg-gray-300 text-xs font-bold">Salvar .py</button>
                </div>
            </div>
            
            <!-- Agora com 'overflow-hidden' e altura flexível forçada -->
            <div id="editor-wrapper" class="flex-1 relative overflow-hidden">
                <textarea id="code-editor"></textarea>
            </div>
            
            <!-- Atalhos Mobile -->
            <div class="bg-gray-50 dark:bg-[#1a1a1c] border-t dark:border-apple-borderDark p-2 flex items-center gap-2 overflow-x-auto rounded-b-2xl">
                <button onclick="insertCode('    ')" class="bg-white dark:bg-apple-surfaceDark border px-3 py-1.5 rounded-lg text-sm font-mono shadow-sm">Tab</button>
                <button onclick="insertCode(':')" class="bg-white dark:bg-apple-surfaceDark border px-3 py-1.5 rounded-lg text-sm font-mono shadow-sm">:</button>
                <button onclick="insertCode('=')" class="bg-white dark:bg-apple-surfaceDark border px-3 py-1.5 rounded-lg text-sm font-mono shadow-sm">=</button>
                <button onclick="insertCode('()')" class="bg-white dark:bg-apple-surfaceDark border px-3 py-1.5 rounded-lg text-sm font-mono shadow-sm">( )</button>
                <button onclick="insertCode('[]')" class="bg-white dark:bg-apple-surfaceDark border px-3 py-1.5 rounded-lg text-sm font-mono shadow-sm">[ ]</button>
                <button onclick="insertCode('{}')" class="bg-white dark:bg-apple-surfaceDark border px-3 py-1.5 rounded-lg text-sm font-mono shadow-sm">{ }</button>
            </div>
        </section>

        <!-- Console / Turtle -->
        <section class="flex-1 flex flex-col min-h-[400px] h-[50vh] lg:h-auto bg-[#1E1E1E] rounded-2xl border border-apple-borderDark shadow-md">
            <div class="bg-[#2D2D2D] px-4 py-3 border-b border-[#3E3E3E] flex items-center justify-between rounded-t-2xl">
                <span class="text-sm font-mono text-gray-400 uppercase tracking-wider">Terminal</span>
                <button onclick="clearConsole()" class="text-sm text-gray-400 hover:text-white">Limpar</button>
            </div>
            
            <div class="flex-1 relative flex flex-col bg-[#1E1E1E] rounded-b-2xl overflow-hidden">
                <div id="output" class="flex-1 p-4 font-mono text-[15px] text-green-400 overflow-y-auto whitespace-pre-wrap leading-relaxed pb-6">~ lexis-ai-engine started...</div>
                
                <div id="turtle-container" class="hidden h-[50%] min-h-[250px] bg-white border-t border-gray-600 flex items-center justify-center p-2 relative">
                    <div id="mycanvas"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        window.onerror = function(msg, url, line) {
            document.getElementById("output").innerHTML += `\n[Erro do Sistema]: ${msg}\n`;
        };

        let tabs = [{ id: 1, name: 'main.py', content: '# Digite o código aqui\n' }];
        let activeTabId = 1;

        let editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
            mode: "python", theme: "dracula", lineNumbers: true, autoCloseBrackets: true, tabSize: 4, indentUnit: 4, lineWrapping: true
        });

        editor.on("change", function() {
            let current = tabs.find(t => t.id === activeTabId);
            if (current) current.content = editor.getValue();
        });

        // 1. LÓGICA DE IMPORTAÇÃO DE ARQUIVOS (PC E MOBILE)
        function importarArquivo(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                editor.setValue(text);
                outf(`\n[+] Arquivo '${file.name}' anexado no editor.\n`);
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        // 2. LÓGICA DE GUIAS DE INDENTAÇÃO
        let guidesVisible = false;
        function toggleGuides() {
            guidesVisible = !guidesVisible;
            const cmElement = document.querySelector(".CodeMirror");
            const btn = document.getElementById("btn-guides");
            
            if (guidesVisible) {
                cmElement.classList.add("show-guides");
                btn.style.color = "#007AFF"; // Apple Blue
                document.getElementById("guides-icon").style.filter = "grayscale(0)";
            } else {
                cmElement.classList.remove("show-guides");
                btn.style.color = ""; 
                document.getElementById("guides-icon").style.filter = "";
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            tabs.forEach(tab => {
                let isActive = tab.id === activeTabId;
                let tabEl = document.createElement('div');
                tabEl.className = `flex items-center gap-2 px-3 py-2 text-sm font-medium rounded-t-lg cursor-pointer border-t border-x ${isActive ? 'bg-white dark:bg-apple-surfaceDark text-apple-blue border-apple-borderLight dark:border-apple-borderDark' : 'text-gray-500 hover:text-gray-800 dark:hover:text-gray-300 border-transparent'}`;
                tabEl.innerHTML = `<span onclick="switchTab(${tab.id})">${tab.name}</span>${tabs.length > 1 ? `<span onclick="closeTab(event, ${tab.id})" class="text-red-500 ml-2 font-bold">×</span>` : ''}`;
                container.appendChild(tabEl);
            });
        }

        function switchTab(id) { activeTabId = id; let tab = tabs.find(t => t.id === id); if (tab) { editor.setValue(tab.content); renderTabs(); } }
        function addNewTab() { let newId = Date.now(); tabs.push({ id: newId, name: `script_${tabs.length + 1}.py`, content: '# Novo código\n' }); switchTab(newId); }
        function closeTab(event, id) { event.stopPropagation(); if (tabs.length <= 1) return; tabs = tabs.filter(t => t.id !== id); if (activeTabId === id) switchTab(tabs[0].id); else renderTabs(); }
        function clearEditor() { if (confirm("Limpar código?")) editor.setValue(""); }
        function saveFile() { let current = tabs.find(t => t.id === activeTabId); let blob = new Blob([editor.getValue()], { type: "text/plain;charset=utf-8" }); let url = URL.createObjectURL(blob); let a = document.createElement('a'); a.href = url; a.download = current ? current.name : "script.py"; a.click(); URL.revokeObjectURL(url); }
        function insertCode(text) { let doc = editor.getDoc(); doc.replaceRange(text, doc.getCursor()); editor.focus(); }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            document.getElementById('theme-icon-sun').classList.toggle('hidden');
            document.getElementById('theme-icon-moon').classList.toggle('hidden');
        }

        let executionCounter = 0;
        function outf(text) { 
            let output = document.getElementById("output"); 
            output.innerHTML += text; 
            output.scrollTop = output.scrollHeight; 
        }
        
        // 3. ATUALIZAÇÃO DO IMPORT
        function builtinRead(x) {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
                throw "Erro: Módulo '" + x + "' não suportado nativamente pelo motor web.";
            }
            return Sk.builtinFiles["files"][x];
        }

        function runPython() {
            let output = document.getElementById("output");
            let turtleBox = document.getElementById("turtle-container");
            output.innerHTML = "~ processando...\n";
            turtleBox.classList.add("hidden");
            
            let prog = editor.getValue();
            let currentExecutionId = ++executionCounter;

            if (prog.includes("import turtle") || prog.includes("from turtle import")) {
                turtleBox.classList.remove("hidden");
            }

            Sk.TurtleGraphics = Sk.TurtleGraphics || {};
            Sk.TurtleGraphics.target = 'mycanvas';

            Sk.pre = "output";
            Sk.configure({
                output: outf,
                read: builtinRead,
                inputfun: function(promptText) {
                    return new Promise(function(resolve, reject) {
                        if (currentExecutionId !== executionCounter) return reject("Stop");
                        if (promptText) outf(promptText);
                        
                        let inputWrapper = document.createElement("div");
                        inputWrapper.className = "flex w-full mt-1";
                        let inputLine = document.createElement("input");
                        inputLine.type = "text";
                        inputLine.className = "bg-[#2A2A2A] text-white border border-apple-blue rounded px-2 py-1 font-mono text-[15px] outline-none flex-1 min-w-[150px]";
                        
                        inputWrapper.appendChild(inputLine);
                        output.appendChild(inputWrapper);
                        inputLine.focus();

                        inputLine.addEventListener("keydown", function(e) {
                            if (e.key === "Enter") {
                                let val = inputLine.value; 
                                inputWrapper.remove(); 
                                outf(val + "\n"); 
                                resolve(val);
                            }
                        });
                    });
                },
                inputfunTakesPrompt: true
            });
            
            var myPromise = Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, prog, true);
            });

            myPromise.then(function(mod) {
                outf("\n[Finalizado]");
            }, function(err) {
                if (currentExecutionId === executionCounter) outf("\n[Erro do Python]: " + err.toString());
            });
        }

        function stopExecution() {
            executionCounter++;
            document.getElementById("output").innerHTML += "\n\n[Interrompido]";
            document.getElementById("mycanvas").innerHTML = ""; 
        }

        function clearConsole() { 
            document.getElementById("output").innerHTML = "~ lexis-ai-engine started...\n"; 
            document.getElementById("turtle-container").classList.add("hidden");
            document.getElementById("mycanvas").innerHTML = "";
        }
        renderTabs();
        editor.setValue(tabs[0].content);
    </script>
</body>
</html>
