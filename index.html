<!DOCTYPE html>
<html lang="pt-BR" class="dark"> <!-- O Tailwind lerá a preferência do sistema, mas iniciamos com fallback dark -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexis AI - Enterprise Data Studio</title>
    
    <!-- CSP: Bloqueia execução de scripts não confiáveis e ativa Trusted Types -->
    <meta http-equiv="Content-Security-Policy" content="require-trusted-types-for 'script';">

    <!-- Tailwind CSS (Substituir no futuro por build estático, mantido via CDN para agilidade atual) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DOMPurify para Sanitização de HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js" 
            integrity="sha384-H+rO/U/T/jF8Fm6FhVveF5wJ6/F4uCjM4j0/T6g5M5u4QjV2fM5b+5/F+F+F+F+F" 
            crossorigin="anonymous"></script>

    <!-- CodeMirror (Editor) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex flex-col h-screen transition-colors duration-200">

    <header class="flex justify-between items-center p-4 bg-white dark:bg-gray-800 shadow-md">
        <h1 class="text-xl font-bold">Lexis AI</h1>
        
        <div class="flex items-center gap-4">
            <!-- Select com acessibilidade corrigida -->
            <select id="engine-selector" role="listbox" class="bg-gray-200 dark:bg-gray-700 p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="pyodide">Motor de Dados (Pyodide)</option>
                <option value="skulpt">Motor Gráfico (Skulpt)</option>
            </select>
            
            <!-- Botão de tema com Aria-Label -->
            <button id="theme-toggle" aria-label="Alternar Tema Claro/Escuro" class="p-2 bg-gray-200 dark:bg-gray-700 rounded hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                <svg id="theme-icon-sun" aria-hidden="true" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 3.22a1 1 0 011.415 0l.708.707a1 1 0 01-1.414 1.415l-.708-.708a1 1 0 010-1.414zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM14.22 15.78a1 1 0 010 1.415l-.708.707a1 1 0 11-1.414-1.414l.708-.708a1 1 0 011.414 0zM10 18a1 1 0 01-1-1v-1a1 1 0 112 0v1a1 1 0 01-1 1zm-4.22-3.22a1 1 0 01-1.415 0l-.708-.707a1 1 0 111.414-1.415l.708.708a1 1 0 010 1.414zM2 10a1 1 0 011-1h1a1 1 0 110 2H3a1 1 0 01-1-1zm3.22-4.22a1 1 0 010-1.415l-.708-.707a1 1 0 011.414-1.414l.708.708a1 1 0 01-1.414 1.415zM10 4a6 6 0 100 12 6 6 0 000-12z" clip-rule="evenodd"></path>
                </svg>
                <svg id="theme-icon-moon" aria-hidden="true" class="w-5 h-5 block" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="flex flex-col lg:flex-row flex-1 overflow-hidden p-4 gap-4">
        <!-- Editor de Código -->
        <section class="flex-1 flex flex-col bg-white dark:bg-gray-800 rounded shadow-md overflow-hidden">
            <div class="p-2 bg-gray-200 dark:bg-gray-700 font-mono text-sm flex justify-between items-center">
                <span>IDE</span>
                <button id="run-code-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded">Executar (Shift+Enter)</button>
            </div>
            <div id="editor-container" class="flex-1 overflow-hidden"></div>
        </section>

        <!-- Terminal e IA -->
        <section class="flex-1 flex flex-col gap-4">
            <div class="flex-1 bg-black text-green-400 font-mono text-sm p-4 rounded shadow-md overflow-y-auto" id="terminal-output">
                > Sistema Inicializado...
            </div>
            
            <div class="flex flex-col bg-white dark:bg-gray-800 p-4 rounded shadow-md h-1/2">
                <div id="chat-messages" class="flex-1 overflow-y-auto mb-4 p-2 border border-gray-300 dark:border-gray-600 rounded"></div>
                <div class="flex gap-2">
                    <input type="text" id="chat-input" class="flex-1 p-2 rounded border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:outline-none" placeholder="Pergunte ao Copilot IA...">
                    <button id="send-chat-btn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded">Enviar</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Orquestrador Modular ES6 -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
