<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lexis AI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"Segoe UI"', 'Roboto', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    },
                    colors: {
                        apple: {
                            blue: '#007AFF',
                            darkBlue: '#0A84FF',
                            bgLight: '#F2F2F7',
                            surfaceLight: '#FFFFFF',
                            bgDark: '#000000',
                            surfaceDark: '#1C1C1E',
                            borderLight: '#E5E5EA',
                            borderDark: '#38383A'
                        }
                    }
                }
            }
        }
    </script>

    <!-- CodeMirror (Editor de Código) CSS e JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

    <!-- Skulpt (Motor Python) -->
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
    
    <style>
        body { 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Ajustes do CodeMirror para preencher o contêiner e adaptar-se ao design */
        .CodeMirror {
            height: 100% !important;
            font-family: 'SFMono-Regular', Menlo, Monaco, Consolas, monospace !important;
            font-size: 15px;
            border-radius: 0 0 1rem 1rem;
            padding-top: 8px;
            padding-bottom: 8px;
        }
        
        /* Personalizando as calhas (onde ficam os números) no tema claro */
        .cm-s-default .CodeMirror-gutters {
            background-color: #f8f8f8;
            border-right: 1px solid #E5E5EA;
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background-color: rgba(150, 150, 150, 0.4); 
            border-radius: 10px; 
        }
        .dark ::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
        }

        #terminal-output {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        * { transition: background-color 0.3s ease, border-color 0.3s ease; }
    </style>
</head>

<body class="bg-apple-bgLight text-gray-900 dark:bg-apple-bgDark dark:text-gray-100 h-screen w-screen flex flex-col overflow-hidden">
    
    <header class="bg-white/80 dark:bg-apple-surfaceDark/80 backdrop-blur-md border-b border-apple-borderLight dark:border-apple-borderDark p-3 px-5 flex justify-between items-center shrink-0 z-10">
        <div class="flex items-center gap-3">
            <!-- Seu Logotipo Oficial -->
            <img src="image.png" alt="Lexis AI Logo" class="w-9 h-9 object-contain drop-shadow-sm rounded-lg dark:invert">
            <h1 class="text-xl font-semibold tracking-tight">Lexis AI</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <button id="theme-toggle" onclick="toggleTheme()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition-colors">
                <svg id="theme-icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                <svg id="theme-icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>

            <button id="run-btn" onclick="runPython()" class="bg-apple-blue dark:bg-apple-darkBlue hover:opacity-90 active:scale-95 text-white font-medium py-1.5 px-5 rounded-full shadow-sm transition-all flex items-center gap-2 text-sm sm:text-base touch-manipulation">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
                Run
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row w-full h-full p-4 gap-4 overflow-hidden">
        
        <!-- Editor Section -->
        <section class="flex-1 flex flex-col bg-white dark:bg-apple-surfaceDark rounded-2xl border border-apple-borderLight dark:border-apple-borderDark shadow-sm overflow-hidden h-1/2 md:h-full">
            <div class="bg-gray-50/80 dark:bg-black/30 text-gray-500 dark:text-gray-400 text-[11px] font-semibold py-2 px-4 uppercase tracking-widest flex justify-between items-center border-b border-apple-borderLight dark:border-apple-borderDark shrink-0 z-10">
                <span>Editor</span>
                <span class="lowercase font-mono normal-case">main.py</span>
            </div>
            
            <!-- CodeMirror irá substituir esta textarea, mas ela serve de base -->
            <div class="flex-1 overflow-hidden relative">
                <textarea id="python-code">
# Solicita os dados de entrada ao usuário
nome = input("Digite o nome da pessoa: ")
idade = int(input("Digite a idade: "))
sexo = input("Digite o sexo (F ou M): ")

sexo = sexo.strip().upper()

if sexo == 'F':
    if idade >= 21 and idade <= 34:
        print(f"\nResultado: {nome} foi ACEITA para o serviço militar.")
    else:
        print(f"\nResultado: {nome} foi RECUSADA.")
elif sexo == 'M':
    if idade >= 18 and idade <= 39:
        print(f"\nResultado: {nome} foi ACEITO para o serviço militar.")
    else:
        print(f"\nResultado: {nome} foi RECUSADO.")
else:
    print("\nErro: Sexo inválido.")
</textarea>
            </div>
        </section>

        <!-- Terminal Section -->
        <section class="flex-1 flex flex-col bg-white dark:bg-apple-surfaceDark rounded-2xl border border-apple-borderLight dark:border-apple-borderDark shadow-sm overflow-hidden h-1/2 md:h-full">
            <div class="bg-gray-50/80 dark:bg-black/30 text-gray-500 dark:text-gray-400 text-[11px] font-semibold py-2 px-4 uppercase tracking-widest shrink-0 flex items-center justify-between border-b border-apple-borderLight dark:border-apple-borderDark">
                <span>Console</span>
                <button onclick="document.getElementById('terminal-output').innerHTML = ''" class="hover:text-apple-blue transition-colors">Limpar</button>
            </div>
            
            <div id="terminal-container" class="flex-1 p-4 overflow-y-auto font-mono text-[14px] leading-relaxed text-gray-700 dark:text-gray-300">
                <div id="terminal-output"></div>
            </div>
        </section>
        
    </main>

    <script>
        // Inicializa o CodeMirror
        var editor = CodeMirror.fromTextArea(document.getElementById("python-code"), {
            mode: "python",
            lineNumbers: true,
            indentUnit: 4,
            matchBrackets: true,
            theme: document.documentElement.classList.contains('dark') ? 'dracula' : 'default'
        });

        function toggleTheme() {
            const htmlTag = document.documentElement;
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');
            
            if (htmlTag.classList.contains('dark')) {
                htmlTag.classList.remove('dark');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
                editor.setOption("theme", "default"); // Muda o editor para tema claro
            } else {
                htmlTag.classList.add('dark');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
                editor.setOption("theme", "dracula"); // Muda o editor para tema escuro
            }
        }

        window.onload = function() {
            const htmlTag = document.documentElement;
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');
            if (htmlTag.classList.contains('dark')) {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            }
            // Atualiza o tamanho do editor para preencher o espaço após carregamento
            setTimeout(() => editor.refresh(), 100);
        };

        function builtinRead(x) {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
                throw "File not found: '" + x + "'";
            return Sk.builtinFiles["files"][x];
        }

        function runPython() {
            // Pega o código do CodeMirror, não mais do textarea nativo
            var code = editor.getValue(); 
            var terminalOutput = document.getElementById("terminal-output");
            var terminalContainer = document.getElementById("terminal-container");
            var runBtn = document.getElementById("run-btn");
            
            terminalOutput.innerHTML = '<span class="text-apple-blue dark:text-apple-darkBlue opacity-70">~ Lexis AI Engine started...</span>\n\n';
            runBtn.disabled = true;
            runBtn.classList.add("opacity-50");
            
            Sk.configure({
                output: function(text) {
                    const textSpan = document.createElement("span");
                    textSpan.textContent = text;
                    terminalOutput.appendChild(textSpan);
                    terminalContainer.scrollTop = terminalContainer.scrollHeight;
                },
                read: builtinRead,
                
                inputfun: function(promptText) {
                    return new Promise(function(resolve, reject) {
                        const promptSpan = document.createElement("span");
                        promptSpan.textContent = promptText;
                        terminalOutput.appendChild(promptSpan);
                        
                        const inlineInput = document.createElement("input");
                        inlineInput.type = "text";
                        inlineInput.setAttribute("autocomplete", "off");
                        inlineInput.setAttribute("autocorrect", "off");
                        inlineInput.setAttribute("autocapitalize", "off");
                        inlineInput.setAttribute("spellcheck", "false");
                        
                        inlineInput.className = "bg-transparent text-apple-blue dark:text-emerald-400 outline-none border-none flex-1 min-w-[50px] inline-block font-mono text-[14px] p-0 m-0 ml-1";
                        
                        terminalOutput.appendChild(inlineInput);
                        inlineInput.focus();
                        terminalContainer.scrollTop = terminalContainer.scrollHeight;
                        
                        inlineInput.addEventListener("keydown", function(e) {
                            if (e.key === "Enter") {
                                e.preventDefault();
                                const inputValue = inlineInput.value;
                                terminalOutput.removeChild(inlineInput);
                                
                                const answerSpan = document.createElement("span");
                                answerSpan.className = "text-apple-blue dark:text-emerald-400 font-medium";
                                answerSpan.textContent = inputValue + "\n";
                                terminalOutput.appendChild(answerSpan);
                                
                                resolve(inputValue);
                            }
                        });
                    });
                }
            });

            var myPromise = Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, code, true);
            });
            
            myPromise.then(function(mod) {
                const doneMsg = document.createElement("span");
                doneMsg.className = "text-gray-400 dark:text-gray-500 text-xs mt-4 block";
                doneMsg.textContent = "[Process finished with exit code 0]";
                terminalOutput.appendChild(doneMsg);
                terminalContainer.scrollTop = terminalContainer.scrollHeight;
                
                runBtn.disabled = false;
                runBtn.classList.remove("opacity-50");
            }, function(err) {
                const errMsg = document.createElement("span");
                errMsg.className = "text-red-500 font-medium block mt-2";
                
                // Formatação simples do erro para facilitar leitura (linha e mensagem)
                let errorText = err.toString();
                if(err.traceback && err.traceback.length > 0) {
                    errorText += ` (Linha ${err.traceback[0].lineno})`;
                }
                errMsg.textContent = errorText;
                
                terminalOutput.appendChild(errMsg);
                terminalContainer.scrollTop = terminalContainer.scrollHeight;
                
                runBtn.disabled = false;
                runBtn.classList.remove("opacity-50");
            });
        }
    </script>
</body>
</html>
